<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AudioMagic.ai — Unified Music Production Platform</title>
    <meta name="description" content="AudioMagic.ai — AI-powered music production: record vocals, generate beats, mix and master in the browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #101116;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100%;
        margin: 0;
        background: #101116;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        font-family: 'Rajdhani', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #root {
        min-height: 100vh;
        background: #101116;
        overflow: visible !important;
      }

      main,
      section,
      article,
      aside,
      div {
        min-height: 0;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        touch-action: manipulation;
      }

      @media (max-height: 760px) {
        html,
        body,
        #root {
          height: auto !important;
          min-height: 100vh !important;
          overflow-y: auto !important;
        }

        [style*='calc(100vh - 36px)'] {
          min-height: auto !important;
          max-height: none !important;
        }

        [style*='sticky'] {
          position: static !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
